  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  gap: ^3.0.1
  intl: ^0.20.2
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  logger: ^2.0.2+1
  path: ^1.9.0
  path_provider: ^2.0.15
  riverpod_annotation: ^2.3.5
  file_picker: ^8.1.2
  # pdf_text: ^0.5.0
  # pdf_text: 
  #   path: packages/flutter_pdf_text
  # pdf_text: 
  #   git : https://github.com/anasmj/flutter-pdf-text.git
  # flutter_pdfview: ^1.3.2
  flutter_launcher_icons: ^0.13.1
  build_runner: ^2.4.12
  syncfusion_flutter_pdfviewer: ^29.2.4
  syncfusion_flutter_pdf: ^29.2.9
  lottie: ^3.3.1
  flutter_svg: ^2.1.0
  # native_pdf_renderer: ^5.0.0+1
  # pdf_render: ^1.2.0
  # pdf_render: ^1.4.12
  # pdfrx: ^1.1.33
  
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0
  isar_generator: ^3.1.0+1
  riverpod_generator: ^2.4.0
  import_sorter: ^4.6.0
  # analyzer: ^6.9.0
  flutter_tts: ^4.2.3

 

flutter_launcher_icons:

  android: "launcher_icon"
  ios: false
  image_path: "assets/images/app.icon/app_icon.png"
  min_sdk_android: 21 

  windows:
    generate: true
    image_path: "assets/images/app.icon/app_icon.png"
    icon_size: 48 # min:48, max:256, default: 48
    
  macos:
    generate: false
    image_path: "assets/images/app.icon/app_icon.png"

dependency_overrides:
  # analyzer: "<=6.5.0"
  # analyzer 6.9.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/dictionary/
    - assets/pdf/
    - assets/icons/
    - assets/lotties/


import_sorter:
  comments: false
